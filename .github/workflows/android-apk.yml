name: Build Cinema TV APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configure TMDb credentials
        env:
          TMDB_BEARER: ${{ secrets.TMDB_BEARER }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          printf 'TMDB_BEARER=%s\nTMDB_API_KEY=%s\n' "$TMDB_BEARER" "$TMDB_API_KEY" > tmdb.properties
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
